name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify client bundles
        if: steps.check.outputs.exists == 'false'
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist/client.js dist/client.*.js)" ]; then
            git status --short -- dist/client.js dist/client.*.js
            echo "::error::dist/client.js or a format chunk is stale; run 'npm run build' and commit the result before releasing."
            exit 1
          fi

      - name: Test
        if: steps.check.outputs.exists == 'false'
        run: npm test

      - name: Pack npm tarball
        if: steps.check.outputs.exists == 'false'
        run: npm pack

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" ./*.tgz \
            --title "$TAG" \
            --notes-file .github/release-notes.md
