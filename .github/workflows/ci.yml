name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check committed client bundles match source
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- client.js client.*.js)" ]; then
            git status --short -- client.js client.*.js
            echo "::error::client.js or a format chunk is stale; run 'npm run build' and commit the result."
            exit 1
          fi
